<script>
    // js clock
    function startTime() {
        const today = new Date();
        let h = today.getHours();
        let m = today.getMinutes();
        let s = today.getSeconds();
        m = checkTime(m);
        s = checkTime(s);
        document.getElementById('txt').innerHTML = h + ":" + m + ":" + s;
        setTimeout(startTime, 1000);
    }

    function checkTime(i) {
        if (i < 10) { i = "0" + i };  // add zero in front of numbers < 10
        return i;
    }
    //   end of js clock

    // building info
    var txt1 = `"William, no matter how long we wrestle with each other, you know what I know. A wicker man burns, a straw bridge falls. There is no curtain to pull away. You are either by me or you are not. I would gladly take your hand." - Ranelin August 5th 2005

    ...It's a fine place, I was sure from our last talk I had convinced you old friend. You are fickle. Look over the plans again and chin-up, I know you will. Anyways, a change of scenery should be great for you, you've always found something anywhere. I do miss you and Suzanne often, tell her I say hello. You both can pick my brain like nobody else, I thank you for that. Let me know.
- Burke
`;
    var speed = 50;
    var i = 0;
    var j = 0;

    function typeWriter1() {
        if (j < txt1.length) {

            j++;
            setTimeout(typeWriter1, speed);
        }
    }

</script>
