<script>
        var txt1 = 'At Harvard, the Carpenter Center for Visual Arts offers a unique form for an academic structure. Its interior layout and central ramp feature serves as an “active participant in the creative process” including flexible meeting and studio spaces for painting, photography, drawing, mixed media, and sculpture.';
        var speed = 50;
        var i = 0;
        var j = 0;

        function typeWriter1() {
            if (j < txt1.length) {
                document.getElementById("demo").innerHTML += txt1.charAt(j);
                j++;
                setTimeout(typeWriter1, speed);
            }
        }
</script>
